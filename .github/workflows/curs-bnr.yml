name: Curs BNR

on:
  schedule:
    # BNR publishes around 13:00 Bucharest time on business days.
    - cron: "17 11 * * 1-5"
    - cron: "47 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curs-bnr
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_curs.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- buget/curs.json && git ls-files --error-unmatch buget/curs.json >/dev/null 2>&1; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add buget/curs.json
          git commit -m "Update EUR rate (curs BNR)"
          git push
